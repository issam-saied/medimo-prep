services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: medimo_prep_mysql
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue:
    build: .
    command: php artisan queue:listen --tries=1 --timeout=0
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  reverb:
    build: .
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build: .
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
